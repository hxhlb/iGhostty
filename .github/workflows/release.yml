# Tag vX.Y.Z → the packages CI built for the tagged commit, published.
#
# Nothing is tested, compiled or packaged here. The push of the commit to
# main ran `ci.yml`: the roothide, rootless and macOS packages each
# compiled, packaged and verified on their own runner, merged into the
# artifact `ighostvt-<sha>`. The tag publishes that artifact, and only once
# that run has succeeded: a failed check fails the run, and the release with
# it. What ships is the file CI verified, not a second build of the same
# commit.
#
# The commit says its version (`make set-version`, the release note, then the
# tag), and the packages CI built are named for it: when they are not named
# for the tag, the checksum step below finds nothing and nothing is
# published.
#
# The tag and the branch usually arrive together, so the run may not exist
# yet when this starts, and it is waited for. A commit that never reached
# main has no run: dispatch CI on the tag (`gh workflow run ci.yml --ref
# vX.Y.Z`), which is also the way back once the artifact is past its thirty
# days, and re-run this. Publishing by hand, when the files arrived some
# other way, is `Scripts/publish-release.sh`.
#
# The relay image is the same: CI pushed `ighostvt-relay:sha-<commit>`, and
# the release only gives that digest its release tags — the version, the
# relay protocol's major tag (`1`, which `compose.yml` pulls), and `latest`.
# `relay-image.txt` records the digest, and `compose.yml` is the file CI
# handed over in the artifact, not the checkout's.

name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  workflow_dispatch:

# One release per tag, and it is never cancelled: a half-uploaded set of
# assets is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: write
      actions: read
      packages: write

    steps:
      - name: Check out iGhostVT
        uses: actions/checkout@v7

      # The newest run on the commit that a push or a dispatch started; a pull
      # request's run names its packages for the merge commit, not this one.
      - name: Wait for CI on the tagged commit
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=""
          for _ in $(seq 30); do
            run="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --json databaseId,event \
              --jq '[.[] | select(.event != "pull_request")][0].databaseId // empty')"
            [ -n "$run" ] && break
            sleep 20
          done
          if [ -z "$run" ]; then
            echo "::error::CI has not run on $GITHUB_SHA: dispatch it on $GITHUB_REF_NAME, then re-run this"
            exit 1
          fi
          echo "CI run $run on $GITHUB_SHA"
          gh run watch "$run" --interval 30 > /dev/null
          conclusion="$(gh run view "$run" --json conclusion --jq .conclusion)"
          if [ "$conclusion" != success ]; then
            echo "::error::CI run $run ended $conclusion: nothing is published"
            exit 1
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Download the packages CI built
        uses: actions/download-artifact@v7
        with:
          name: ighostvt-${{ github.sha }}
          path: build/Packages/
          run-id: ${{ steps.ci.outputs.run }}
          github-token: ${{ github.token }}

      # A new tag on a manifest that already exists: the digest the release
      # names is the one CI built and pushed, byte for byte. The major tag is
      # the relay protocol's version, read from the tagged source (not
      # compiled) — it moves only when the protocol does, never with the app.
      - name: Tag the relay image CI built
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          owner="$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REPOSITORY_OWNER")"
          image="ghcr.io/$owner/ighostvt-relay"
          protocol="$(sed -n 's/^const Version = \([0-9][0-9]*\)$/\1/p' Relay/internal/protocol/protocol.go)"
          [[ "$protocol" =~ ^[0-9]+$ ]] || { echo "::error::cannot read the relay protocol version"; exit 1; }
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          digest="$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" == sha256:* ]] || { echo "::error::CI pushed no $image:sha-$GITHUB_SHA"; exit 1; }
          docker buildx imagetools create \
            -t "$image:$version" -t "$image:$protocol" -t "$image:latest" \
            "$image@$digest"
          for tag in "$version" "$protocol" latest; do
            got="$(docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' | jq -r .digest)"
            [ "$got" = "$digest" ] || { echo "::error::$image:$tag is $got, not $digest"; exit 1; }
          done
          echo "$image@$digest" > build/Packages/relay-image.txt
          cat build/Packages/relay-image.txt

      # CI's lists prove the transfer. The release's own lists are written for
      # exactly the files it carries, named for the tag, and a missing one
      # fails here. The macOS zip keeps its own list, as previous releases
      # attached it — the .deb fetchers read `SHA256SUMS` alone.
      - name: Verify the packages and write the release checksums
        working-directory: build/Packages
        run: |
          set -euo pipefail
          sha256sum --check SHA256SUMS
          sha256sum --check SHA256SUMS.macos
          version="${GITHUB_REF_NAME#v}"
          sha256sum \
            "wiki.qaq.ighostvt_${version}_iphoneos-arm64e.deb" \
            "wiki.qaq.ighostvt_${version}_iphoneos-arm64.deb" \
            "iGhostVT-${version}-roothide-dSYMs.zip" \
            "iGhostVT-${version}-rootless-dSYMs.zip" \
            compose.yml > SHA256SUMS
          sha256sum \
            "iGhostVT-${version}-macos.zip" \
            "iGhostVT-${version}-macos-dSYMs.zip" > SHA256SUMS.macos
          cat SHA256SUMS SHA256SUMS.macos

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/ighostvt-release.md"
          if [ -f "Documents/Releases/$version.md" ]; then
            cp "Documents/Releases/$version.md" "$notes"
          else
            cat > "$notes" <<NOTES
          iGhostVT $version, for roothide and rootless (/var/jb) bootstraps and for the Mac.

          The Mac app is ad-hoc signed; clear its quarantine once with \`xattr -dr com.apple.quarantine /Applications/iGhostVT.app\`.

          SHA-256 sums are in \`SHA256SUMS\`, and the Mac app's in \`SHA256SUMS.macos\`.
          NOTES
          fi
          files=("build/Packages/wiki.qaq.ighostvt_${version}_iphoneos-arm64e.deb"
                 "build/Packages/wiki.qaq.ighostvt_${version}_iphoneos-arm64.deb"
                 "build/Packages/iGhostVT-${version}-macos.zip"
                 "build/Packages/iGhostVT-${version}-roothide-dSYMs.zip"
                 "build/Packages/iGhostVT-${version}-rootless-dSYMs.zip"
                 "build/Packages/iGhostVT-${version}-macos-dSYMs.zip"
                 "build/Packages/compose.yml"
                 "build/Packages/relay-image.txt"
                 "build/Packages/SHA256SUMS"
                 "build/Packages/SHA256SUMS.macos")
          # Ten assets, and the dSYM zips are not small: a 5xx from the
          # upload API must not end a release that already has a verified
          # set of bytes in hand. `Scripts/publish-release.sh` retried for
          # exactly this reason, and the retry comes across with it.
          # `gh release view` decides create against upload on every round,
          # so a create that half-succeeded is finished as an upload.
          publish() {
            if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
              gh release upload "$GITHUB_REF_NAME" --clobber "${files[@]}" || return 1
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes" || return 1
            else
              gh release create "$GITHUB_REF_NAME" --verify-tag \
                --title "iGhostVT $version" --notes-file "$notes" "${files[@]}" || return 1
            fi
          }
          for attempt in 1 2 3 4 5; do
            publish && exit 0
            echo "publish attempt $attempt failed; retrying in 20s" >&2
            sleep 20
          done
          echo "::error::could not publish $GITHUB_REF_NAME after 5 attempts"
          exit 1
